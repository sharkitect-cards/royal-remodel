<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Daniel Molina &mdash; Royal Remodel</title>
    <meta name="description" content="Daniel Molina, Royal Remodel. Residential remodeling - Kansas City Metro.">

    <!-- PWA / Home Screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Card">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1A1A1A">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* Brand colors live on the button + the QR only. The card stays clean. */
            --gold: #B08D4C;
            --gold-rgb: 176, 141, 76;
            --gold-lt: #E6C983;
            --gold-lt-rgb: 230, 201, 131;
            --split: linear-gradient(100deg, var(--gold) 0%, var(--gold-lt) 100%);
            --navy: #0D141D;

            --bg: #1A1A1A;
            --text-primary: #FFFFFF;
            --text-secondary: #C9CCD1;
            --text-muted: #808285;
            --hairline: rgba(255, 255, 255, 0.10);
        }

        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
            background: linear-gradient(180deg, #232323 0%, var(--bg) 100%);
            border: 1px solid var(--hairline);
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* One restrained brand cue on the top edge */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 58%;
            height: 2px;
            background: var(--split);
            border-radius: 2px;
        }

        .logo {
            width: 150px;
            height: 150px;
            margin: 0 auto 22px;
            border-radius: 50%;
            overflow: hidden;
        }

        .logo img { width: 100%; height: 100%; object-fit: contain; }

        .name {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 21px;
            color: var(--text-primary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .company {
            font-weight: 500;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        /* Hairline rule with a small crown ornament at center */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0 auto 18px;
            width: 190px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--hairline);
        }
        .crown {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 6px rgba(var(--gold-rgb), 0.45));
        }

        .tagline {
            font-family: 'Orbitron', sans-serif;
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 14px;
        }

        .bio {
            font-size: 13.5px;
            line-height: 1.65;
            color: var(--text-secondary);
            font-weight: 300;
            margin-bottom: 26px;
            padding: 0 6px;
        }

        .bio .area { color: var(--text-muted); font-size: 12.5px; }

        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        /* Neutral rows - clean, no per-row color */
        .contact-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--hairline);
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: all 0.2s ease;
        }

        .contact-link:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.22);
        }

        .contact-link svg { width: 18px; height: 18px; flex-shrink: 0; fill: var(--text-secondary); }
        .contact-link span { color: var(--text-secondary); }

        .social { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }

        .social a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--hairline);
            transition: all 0.2s ease;
        }

        .social a:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-2px); }
        .social svg { width: 21px; height: 21px; fill: var(--text-secondary); }
        .social a:hover svg { fill: var(--text-primary); }

        /* SINGLE action: show the QR. No direct .vcf link - standing card standard.
           Text is navy, not white: white on gold fails contrast and reads washed out. */
        .save-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            background: var(--split);
            color: var(--navy);
            transition: all 0.2s ease;
            margin-bottom: 22px;
        }

        .save-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(var(--gold-rgb), 0.28);
        }

        .save-btn:active { transform: translateY(0); }
        .save-btn svg { width: 19px; height: 19px; fill: var(--navy); }

        .qr-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .qr-overlay.active { display: flex; }

        .qr-modal {
            background: #202020;
            border: 1px solid var(--hairline);
            border-radius: 18px;
            padding: 28px;
            text-align: center;
            max-width: 340px;
            width: 100%;
        }

        .qr-modal h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .qr-modal p { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }

        .qr-frame {
            background: #FFFFFF;
            border-radius: 14px;
            padding: 10px;
            margin: 0 auto 18px;
            width: 250px;
        }
        .qr-frame img { width: 100%; height: auto; display: block; }

        .qr-close {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--text-secondary);
            padding: 10px 26px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .qr-close:hover { border-color: rgba(255, 255, 255, 0.4); color: var(--text-primary); }

        .footer { font-size: 11px; color: var(--text-muted); }
        .footer a { color: var(--text-secondary); text-decoration: none; }

        @media (max-width: 480px) {
            .card { padding: 32px 24px; }
            .name { font-size: 18px; letter-spacing: 1px; }
            .tagline { font-size: 11px; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="card">

                <span>Contact@RoyalRemodelKC.com</span>

            <a href="https://www.facebook.com/share/1CMpNzNVkh/" target="_blank" rel="noopener" aria-label="Facebook">
                <svg viewBox="0 0 24 24"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>

    </div>

    <div class="qr-overlay" id="qrOverlay" onclick="toggleQR()">
        <div class="qr-modal" onclick="event.stopPropagation()">
            <h3>SCAN TO SAVE</h3>
            <p>Point your camera at the code</p>
            <div class="qr-frame">
                <img src="qr-code.png" alt="Scan to save Daniel Molina's contact">

            <button class="qr-close" onclick="toggleQR()">Close</button>

    <script>
        function toggleQR() {
            document.getElementById('qrOverlay').classList.toggle('active');
        }
    </script>
</body>
